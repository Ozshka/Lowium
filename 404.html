<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Not Found | Lowium</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&display=swap');

  :root {
    --bg: #fcfbf9;
    --card-bg: #ffffff;
    --text-main: #2d2a26;
    --text-muted: #9c9891;
    --accent: #c2593f;
    --accent-hover: #a84b34;
    --border: #eceae6;
    --shadow: rgba(45, 42, 38, 0.03);
  }

  [data-theme="dark"] {
    --bg: #1a1816;
    --card-bg: #24211e;
    --text-main: #e5e3df;
    --text-muted: #8a857f;
    --accent: #d96b4f;
    --accent-hover: #e87e63;
    --border: #3a3632;
    --shadow: rgba(0, 0, 0, 0.2);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body { 
    min-height: 100vh; 
    background-color: var(--bg);
    color: var(--text-main);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    transition: background-color 0.3s ease, color 0.3s ease;
    display: flex;
    flex-direction: column;
  }
  
  .container { 
    max-width: 800px; 
    margin: 0 auto; 
    padding: 24px 24px 48px; 
    flex: 1; 
    width: 100%;
    display: flex;
    flex-direction: column;
  }
  
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 4px 20px var(--shadow);
  }
  
  header { 
    display: flex; 
    align-items: center; 
    justify-content: space-between; 
    padding: 20px 32px; 
    margin-bottom: 32px; 
  }
  
  header h1 { 
    font-family: 'Lora', serif;
    font-size: 1.6rem; 
    font-weight: 600; 
    color: var(--text-main);
  }

  header a {
    text-decoration: none;
    color: inherit;
  }
  
  /* Кнопка точно как .btn-primary на основном сайте */
  .btn-primary { 
    display: inline-block;
    text-decoration: none;
    cursor: pointer; 
    font-family: 'Inter', sans-serif; 
    border: none; 
    border-radius: 8px; 
    padding: 10px 20px; 
    font-weight: 500; 
    font-size: 0.9rem; 
    background: var(--accent); 
    color: #fff; 
    transition: all 0.2s ease; 
  }
  
  .btn-primary:hover { 
    background: var(--accent-hover); 
  }

  .content-card {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 80px 32px;
    text-align: center;
  }

  .error-code {
    font-family: 'Lora', serif;
    font-size: 8rem;
    font-weight: 600;
    line-height: 1;
    color: var(--accent);
    margin-bottom: 16px;
    opacity: 0.8;
    letter-spacing: -2px;
  }

  .content-card h2 {
    font-family: 'Lora', serif;
    font-size: 1.8rem;
    font-weight: 600;
    margin-bottom: 16px;
    color: var(--text-main);
  }

  .content-card p {
    color: var(--text-muted);
    font-size: 1.05rem;
    line-height: 1.6;
    margin-bottom: 32px;
    max-width: 400px;
  }

  footer {
    text-align: center;
    padding: 24px;
    color: var(--text-muted);
    font-size: 0.85rem;
    font-weight: 500;
  }

  @media (max-width: 600px) {
    .container { padding: 20px 16px; }
    header { flex-direction: column; gap: 16px; align-items: stretch; text-align: center; padding: 20px; }
    .content-card { padding: 60px 24px; }
    .error-code { font-size: 6rem; }
    .content-card h2 { font-size: 1.5rem; }
  }
</style>
<script>
  const savedTheme = localStorage.getItem('theme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
</script>
</head>
<body>

<div class="container">
  <header class="card">
    <a href="/"><h1>Lowium</h1></a>
  </header>

  <div class="content-card card">
    <div class="error-code">404</div>
    <h2>Page not found</h2>
    <p>The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
    <a href="/" class="btn-primary">Back to Home</a>
  </div>
</div>

<footer>
  &copy; 2026 Ozsh's Lowium
</footer>

</body>
</html>
